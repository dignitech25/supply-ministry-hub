<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Route-varying metadata (title, description, canonical, Open Graph, Twitter)
      is owned exclusively by src/components/SEO.tsx via react-helmet-async.

      It must NOT be duplicated here. react-helmet-async only replaces tags it
      previously rendered itself (those carrying data-rh); tags hard-coded in
      this file are left in the DOM alongside Helmet's. The result was every
      route serving two <meta name="description"> tags and two <link
      rel="canonical"> tags -- one of them permanently claiming the homepage as
      the canonical URL for every product and category page on the site.

      Only route-invariant tags belong below.
    -->
    <title>Supply Ministry - Assistive Technology Solutions Australia | Mobility Aids & NDIS Equipment</title>
    <meta name="author" content="Supply Ministry" />

    <meta property="og:site_name" content="Supply Ministry" />

    <!-- Mobile browser theme color -->
    <meta name="theme-color" content="#F4EFE6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=sm2026a">
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png?v=ff16b597">
    <link rel="shortcut icon" href="/favicon.ico?v=sm2026a">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png?v=ff16b597">
    
    <!-- Editorial typography (homepage redesign) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,200;1,200&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-89R61H0W2W"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-89R61H0W2W');
    </script>
  </head>

  <body class="bg-cream text-ink">
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-[9999] focus:bg-white focus:text-black focus:px-4 focus:py-2 focus:rounded focus:shadow-lg">Skip to main content</a>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: sans-serif;">
        <h1>JavaScript Required</h1>
        <p>Please enable JavaScript to use Supply Ministry. Visit us at <a href="mailto:alex@supplyministry.com.au">alex@supplyministry.com.au</a> or call 0452 002 450.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
